<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="A Panda and a nut who teach — C, Python, Go, networking, Kubernetes and LLMs">
  <title>A Panda and a nut who teach</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12191f"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 19px; }
      .kw  { fill: #ff7b72; }
      .fn  { fill: #d2a8ff; }
      .str { fill: #a5d6ff; }
      .typ { fill: #79c0ff; }
      .cmt { fill: #8b949e; }
      .txt { fill: #c9d1d9; }
    </style>
  </defs>

  <rect width="1280" height="640" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="638" rx="19" fill="none" stroke="#30363d" stroke-width="2"/>

  <!-- headline -->
  <text class="sans" x="80" y="112" font-size="54" font-weight="700" fill="#f0f6fc">A Panda and a nut who teach</text>
  <text class="sans" x="80" y="158" font-size="23" fill="#8b949e">C · Python · Go · Networking · Kubernetes · Infrastructure · LLMs</text>
  <line x1="80" y1="188" x2="1200" y2="188" stroke="#30363d" stroke-width="2"/>

  <!-- the two of them: a panda and a nut -->
  <g transform="translate(331 389) scale(1.14) translate(-331 -389)">
  <ellipse cx="331" cy="389" rx="150" ry="95" fill="#ffffff" opacity="0.05"/>

  <!-- the panda -->
  <g>
    <circle cx="222" cy="342" r="22" fill="#0d1117" stroke="#484f58" stroke-width="2"/>
    <circle cx="294" cy="342" r="22" fill="#0d1117" stroke="#484f58" stroke-width="2"/>
    <circle cx="222" cy="342" r="10" fill="#2d333b"/>
    <circle cx="294" cy="342" r="10" fill="#2d333b"/>

    <circle cx="258" cy="390" r="54" fill="#e8eef5"/>
    <ellipse cx="258" cy="402" rx="29" ry="23" fill="#fbfdff"/>

    <ellipse cx="239" cy="381" rx="15" ry="20" fill="#0d1117" transform="rotate(-26 239 381)"/>
    <ellipse cx="277" cy="381" rx="15" ry="20" fill="#0d1117" transform="rotate(26 277 381)"/>

    <ellipse cx="241" cy="384" rx="5.5" ry="5.5" fill="#fbfdff">
      <animate attributeName="ry" values="5.5;5.5;0.5;5.5;5.5" keyTimes="0;0.93;0.955;0.98;1" dur="5.2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="275" cy="384" rx="5.5" ry="5.5" fill="#fbfdff">
      <animate attributeName="ry" values="5.5;5.5;0.5;5.5;5.5" keyTimes="0;0.93;0.955;0.98;1" dur="5.2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="242" cy="385" rx="3.2" ry="3.2" fill="#0d1117">
      <animate attributeName="ry" values="3.2;3.2;0.3;3.2;3.2" keyTimes="0;0.93;0.955;0.98;1" dur="5.2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="274" cy="385" rx="3.2" ry="3.2" fill="#0d1117">
      <animate attributeName="ry" values="3.2;3.2;0.3;3.2;3.2" keyTimes="0;0.93;0.955;0.98;1" dur="5.2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="240.7" cy="383.6" rx="1.4" ry="1.4" fill="#ffffff">
      <animate attributeName="ry" values="1.4;1.4;0.15;1.4;1.4" keyTimes="0;0.93;0.955;0.98;1" dur="5.2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="272.7" cy="383.6" rx="1.4" ry="1.4" fill="#ffffff">
      <animate attributeName="ry" values="1.4;1.4;0.15;1.4;1.4" keyTimes="0;0.93;0.955;0.98;1" dur="5.2s" repeatCount="indefinite"/>
    </ellipse>

    <path d="M249 396 Q258 391 267 396 Q267 405 258 409 Q249 405 249 396 Z" fill="#0d1117"/>
    <path d="M258 409 L258 414" fill="none" stroke="#0d1117" stroke-width="3" stroke-linecap="round"/>
    <path d="M258 414 Q 249 425 240 415" fill="none" stroke="#0d1117" stroke-width="3" stroke-linecap="round"/>
    <path d="M258 414 Q 267 425 276 415" fill="none" stroke="#0d1117" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- the nut -->
  <g>
    <path d="M412 350 l0 -12" fill="none" stroke="#6b4526" stroke-width="4.5" stroke-linecap="round"/>
    <ellipse cx="412" cy="404" rx="50" ry="54" fill="#d19a5e"/>
    <path d="M364.9 386 A 50 54 0 0 1 459.1 386 Z" fill="#8a5f3a"/>
    <path d="M364.9 386 L459.1 386" stroke="#6b4526" stroke-width="2" opacity="0.5"/>
    <ellipse cx="390" cy="398" rx="10" ry="8" fill="#ffffff" opacity="0.14" transform="rotate(-25 390 398)"/>

    <ellipse cx="384" cy="428" rx="8" ry="5" fill="#e8836a" opacity="0.35"/>
    <ellipse cx="440" cy="428" rx="8" ry="5" fill="#e8836a" opacity="0.35"/>

    <ellipse cx="394" cy="412" rx="6" ry="6" fill="#3d2a18">
      <animate attributeName="ry" values="6;6;0.5;6;6" keyTimes="0;0.93;0.955;0.98;1" dur="6.7s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="430" cy="412" rx="6" ry="6" fill="#3d2a18">
      <animate attributeName="ry" values="6;6;0.5;6;6" keyTimes="0;0.93;0.955;0.98;1" dur="6.7s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="392.2" cy="410.2" rx="1.7" ry="1.7" fill="#ffffff">
      <animate attributeName="ry" values="1.7;1.7;0.2;1.7;1.7" keyTimes="0;0.93;0.955;0.98;1" dur="6.7s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="428.2" cy="410.2" rx="1.7" ry="1.7" fill="#ffffff">
      <animate attributeName="ry" values="1.7;1.7;0.2;1.7;1.7" keyTimes="0;0.93;0.955;0.98;1" dur="6.7s" repeatCount="indefinite"/>
    </ellipse>

    <path d="M399 429 Q 412 441 425 429" fill="none" stroke="#3d2a18" stroke-width="3.2" stroke-linecap="round"/>
  </g>
  </g>

  <!-- code panel -->
  <rect x="620" y="215" width="580" height="350" rx="14" fill="#010409" stroke="#30363d" stroke-width="2"/>
  <line x1="620" y1="255" x2="1200" y2="255" stroke="#30363d" stroke-width="2"/>
  <circle cx="646" cy="235" r="6" fill="#ff5f57"/>
  <circle cx="668" cy="235" r="6" fill="#febc2e"/>
  <circle cx="690" cy="235" r="6" fill="#28c840"/>

  <g class="mono" xml:space="preserve">
    <text x="648" y="300"><tspan class="cmt"># python101</tspan></text>
    <text x="648" y="330"><tspan class="kw">def</tspan><tspan class="fn"> greet</tspan><tspan class="txt">(name: </tspan><tspan class="typ">str</tspan><tspan class="txt">) -&gt; </tspan><tspan class="typ">str</tspan><tspan class="txt">:</tspan></text>
    <text x="648" y="360"><tspan class="txt">    </tspan><tspan class="kw">return</tspan><tspan class="str"> f"Hello, {name}!"</tspan></text>
    <text x="648" y="420"><tspan class="cmt">// go-lecture</tspan></text>
    <text x="648" y="450"><tspan class="kw">func</tspan><tspan class="fn"> main</tspan><tspan class="txt">() {</tspan></text>
    <text x="648" y="480"><tspan class="txt">    fmt.</tspan><tspan class="fn">Println</tspan><tspan class="txt">(</tspan><tspan class="str">"Hello, world!"</tspan><tspan class="txt">)</tspan></text>
    <text x="648" y="510"><tspan class="txt">}</tspan></text>
  </g>

  <!-- a cursor, still blinking: there is always more to teach -->
  <rect x="662" y="496" width="10" height="18" fill="#c9d1d9">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="1.06s" repeatCount="indefinite"/>
  </rect>

  <text class="sans" x="80" y="600" font-size="20" fill="#8b949e">github.com/1995parham-teaching</text>
</svg>
