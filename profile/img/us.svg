<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 10 420 410" width="420" height="410" role="img" aria-label="A white bear and a grey bear teaching together at a board">
  <title>us</title>

  <defs>
    <style>
      .ln  { stroke: #4b3832; stroke-width: 4; stroke-linejoin: round; }
      .ln2 { stroke: #4b3832; stroke-width: 3.4; fill: none; stroke-linecap: round; }
    </style>
  </defs>

  <!-- the board they teach at -->
  <g>
    <rect x="95" y="26" width="330" height="168" rx="10" fill="#8a6a52" class="ln"/>
    <rect x="105" y="36" width="310" height="148" rx="5" fill="#f7f9fb"/>
    <rect x="126" y="60" width="138" height="7" rx="3.5" fill="#6b7a8f"/>
    <rect x="126" y="80" width="196" height="7" rx="3.5" fill="#9aa7b8"/>
    <circle cx="348" cy="120" r="22" fill="none" stroke="#e07a5f" stroke-width="5"/>
    <path d="M286 120 L328 120" stroke="#6b7a8f" stroke-width="5" stroke-linecap="round"/>
    <path d="M318 111 L328 120 L318 129" fill="none" stroke="#6b7a8f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="126" y="150" width="108" height="7" rx="3.5" fill="#9aa7b8"/>
  </g>

  <!-- the grey bear, pointing -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0"
                      keyTimes="0;0.5;1" dur="3.3s" repeatCount="indefinite"/>

    <ellipse cx="163" cy="372" rx="20" ry="13" fill="#b0b6bf" class="ln"/>
    <ellipse cx="217" cy="372" rx="20" ry="13" fill="#b0b6bf" class="ln"/>
    <ellipse cx="190" cy="330" rx="52" ry="46" fill="#b0b6bf" class="ln"/>
    <ellipse cx="244" cy="320" rx="15" ry="25" fill="#b0b6bf" class="ln" transform="rotate(20 244 320)"/>

    <path d="M120 280 L104 200" class="ln2" stroke="#8a5f3a" stroke-width="7"/>
    <circle cx="103" cy="197" r="6" fill="#e07a5f" class="ln" stroke-width="3"/>
    <ellipse cx="126" cy="300" rx="15" ry="27" fill="#b0b6bf" class="ln" transform="rotate(-40 126 300)"/>

    <circle cx="152" cy="217" r="19" fill="#b0b6bf" class="ln"/>
    <circle cx="228" cy="217" r="19" fill="#b0b6bf" class="ln"/>
    <circle cx="152" cy="217" r="9" fill="#f0c0bc"/>
    <circle cx="228" cy="217" r="9" fill="#f0c0bc"/>
    <circle cx="190" cy="255" r="52" fill="#b0b6bf" class="ln"/>

    <ellipse cx="152" cy="270" rx="9" ry="6" fill="#f4a6a0" opacity="0.75"/>
    <ellipse cx="228" cy="270" rx="9" ry="6" fill="#f4a6a0" opacity="0.75"/>
    <ellipse cx="190" cy="273" rx="23" ry="17" fill="#d7dbe0"/>

    <ellipse cx="168" cy="250" rx="6.5" ry="6.5" fill="#4b3832">
      <animate attributeName="ry" values="6.5;6.5;0.5;6.5;6.5" keyTimes="0;0.93;0.955;0.98;1" dur="5.2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="212" cy="250" rx="6.5" ry="6.5" fill="#4b3832">
      <animate attributeName="ry" values="6.5;6.5;0.5;6.5;6.5" keyTimes="0;0.93;0.955;0.98;1" dur="5.2s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="166" cy="248" r="1.9" fill="#ffffff"/>
    <circle cx="210" cy="248" r="1.9" fill="#ffffff"/>

    <ellipse cx="190" cy="266" rx="7" ry="5" fill="#4b3832"/>
    <path d="M190 271 L190 275" class="ln2"/>
    <path d="M190 275 Q 183 282 177 276" class="ln2"/>
    <path d="M190 275 Q 197 282 203 276" class="ln2"/>
  </g>

  <!-- the white bear, with a book -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0"
                      keyTimes="0;0.5;1" dur="3.9s" repeatCount="indefinite"/>

    <ellipse cx="308" cy="376" rx="18" ry="12" fill="#fdfdfb" class="ln"/>
    <ellipse cx="352" cy="376" rx="18" ry="12" fill="#fdfdfb" class="ln"/>
    <ellipse cx="330" cy="338" rx="48" ry="43" fill="#fdfdfb" class="ln"/>

    <circle cx="297" cy="236" r="17" fill="#fdfdfb" class="ln"/>
    <circle cx="363" cy="236" r="17" fill="#fdfdfb" class="ln"/>
    <circle cx="297" cy="236" r="8" fill="#ffd9d4"/>
    <circle cx="363" cy="236" r="8" fill="#ffd9d4"/>
    <circle cx="330" cy="270" r="48" fill="#fdfdfb" class="ln"/>

    <ellipse cx="297" cy="284" rx="8.5" ry="5.5" fill="#f4a6a0" opacity="0.75"/>
    <ellipse cx="363" cy="284" rx="8.5" ry="5.5" fill="#f4a6a0" opacity="0.75"/>
    <ellipse cx="330" cy="287" rx="21" ry="16" fill="#f2ece8"/>

    <ellipse cx="311" cy="265" rx="6" ry="6" fill="#4b3832">
      <animate attributeName="ry" values="6;6;0.5;6;6" keyTimes="0;0.93;0.955;0.98;1" dur="6.7s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="349" cy="265" rx="6" ry="6" fill="#4b3832">
      <animate attributeName="ry" values="6;6;0.5;6;6" keyTimes="0;0.93;0.955;0.98;1" dur="6.7s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="309.2" cy="263.2" r="1.8" fill="#ffffff"/>
    <circle cx="347.2" cy="263.2" r="1.8" fill="#ffffff"/>

    <ellipse cx="330" cy="281" rx="6.5" ry="4.5" fill="#4b3832"/>
    <path d="M330 285.5 L330 289" class="ln2"/>
    <path d="M330 289 Q 324 295 318 290" class="ln2"/>
    <path d="M330 289 Q 336 295 342 290" class="ln2"/>

    <rect x="303" y="330" width="54" height="34" rx="4" fill="#7aa7d9" class="ln"/>
    <path d="M330 332 L330 362" class="ln2" stroke-width="3"/>
    <ellipse cx="291" cy="336" rx="14" ry="23" fill="#fdfdfb" class="ln" transform="rotate(22 291 336)"/>
    <ellipse cx="369" cy="336" rx="14" ry="23" fill="#fdfdfb" class="ln" transform="rotate(-22 369 336)"/>
  </g>

  <ellipse cx="262" cy="393" rx="165" ry="13" fill="#ffffff" opacity="0.06"/>
</svg>
